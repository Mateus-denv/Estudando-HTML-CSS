    <title>Contato - ITALIANIN</title>

<body>
    <div class="banner">
        
        <div class="head">
            <div class="inicio">
                <h2>ITALIANIN</h2>
            </div>
            <div class="box">
                <div><a href="/MateusAT1/index.html">Inicio</a></div>
                <div><a href="/MateusAT1/pages/produtos.html">Produtos</a></div> 
            </div>
        </div>

        <main class="contato-container">
            <h1>Fale Conosco</h1>
            <p>Tem alguma dúvida, sugestão ou pedido? Preencha o formulário abaixo.</p>
            
            <form action="enviar-formulario.php" method="post">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX">
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="6" placeholder="Deixe sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit">Enviar Mensagem</button>
            </form>

            <div class="loja-endereco">
                <h2>Nosso Endereço</h2>
                <address>
                    Rua das Palmeiras, nº 123<br>
                    Bairro Central, Cidade Fictícia - BA<br>
                    CEP: 12345-678
                </address>
            </div>
        </main>
        
    </div>
