<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/MateusAT7/part2/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Exemplo DOM - Form</h1>
    </header>
    <main id="formulario">
        <form name="Cadastro">
            <table>
                <tr>
                    <td><label for="login">Login</label></td>
                    <td><input type="text" name="login" id="idlogin"></td>
                </tr>
                <tr>
                    <td><label for="senha">Senha</label></td>
                    <td><input type="password" name="" id="idpassword"></td>
                </tr>
                <tr>
                    <td><label for="repitasenha">Confirme a senha</label></td>
                    <td><input type="repitasenha" name="" id="idconfirme"></td>
                </tr>
            </table>
            <input type="button" value="Entra" onclick="ValidarCadastro()">
        </form>
    </main>
    <footer>
        <p>Todos Direitos Reservados</p>
    </footer>
</body>
</html>
