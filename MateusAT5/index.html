<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/MateusAT5/assets//css/index.css">
    <title>Mateus Santos - Desenvolvedor</title>
    
</head>

<body>
    <!-- ==== HEADER/NAVEGAÇÃO ==== -->
    <header>
        <nav class="navbar">
            <a href="#" class="logo">Inicio</a>
            
            <!-- Menu de navegação -->
            <ul class="nav-links">
                <li><a href="#curriculo"><i class="fas fa-file-alt"></i> Currículo</a></li>
                <li><a href="#portfolio"><i class="fas fa-briefcase"></i> Portfólio</a></li>
            </ul>
        </nav>
    </header>

    <!-- ==== CONTEÚDO PRINCIPAL ==== -->
    <main>
        <!-- Seção principal (hero) -->
        <div class="hero">
            <img src="/MateusAT5/assets/images/mateus.webp" alt="Foto de Mateus Santos" class="profile-picture">
            <h1>Mateus Santos</h1>
            <h2>Olá, conheça um pouco sobre mim</h2>
            <p>Desenvolvedor apaixonado por criar experiências digitais únicas e funcionais</p>
            
            <!-- Botões de ação -->
            <div class="cta-buttons">
                <a href="#portfolio" class="btn btn-primary">
                    <i class="fas fa-code"></i> Ver Projetos
                </a>
                <a href="#curriculo" class="btn btn-secondary">
                    <i class="fas fa-download"></i> Baixar CV
                </a>
            </div>
        </div>

        <!-- Indicador de scroll (setinha que pula) -->
        <div class="scroll-indicator">
            <i class="fas fa-chevron-down" style="color:#0043fc; font-size: 1.5rem;"></i>
        </div>
    </main>

    <!-- ==== FOOTER/RODAPÉ ==== -->
    <footer>
        <div class="footer-content">
            <h4>Conecte-se Comigo</h4>
            
            <!-- Links das redes sociais -->
            <div class="social-links">
                <a href="#" class="social-link">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </a>
                <a href="#" class="social-link">
                    <i class="fab fa-linkedin"></i>
                    <span>LinkedIn</span>
                </a>
                <a href="#" class="social-link">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </a>
                <a href="#" class="social-link">
                    <i class="fab fa-tiktok"></i>
                    <span>TikTok</span>
                </a>
                <a href="#" class="social-link">
                    <i class="fab fa-whatsapp"></i>
                    <span>WhatsApp</span>
                </a>
            </div>
            
            <!-- Copyright -->
            <p class="copyright">© 2024 Mateus Santos. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
