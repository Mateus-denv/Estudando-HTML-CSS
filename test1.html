<!DOCTYPE html>

<head>

    <style>
    
    h1, div,blockquote {
        background: rgba(83, 83, 83, 0.103);

        <p>

            <ul>

                <li class="oque-gosto"><b>Eu gosto de:</b> jogar</li>
                <li class="oque-gosto" ><b>Eu gosto de:</b> treinar</li>
