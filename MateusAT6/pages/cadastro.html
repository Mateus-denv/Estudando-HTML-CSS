<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Porsche</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header class="header-container">
        <div class="logo">PORSCHE</div>
        <nav class="nav-links">
            <a href="../index.html">Início</a>
            <a href="./saiba-mais.html">Saiba Mais</a>
        </nav>
    </header>

    <main>
        <div class="content-page-container">
            <h1>Faça seu Cadastro</h1>
            <p>Preencha os campos abaixo para receber novidades e ofertas exclusivas da Porsche.</p>

            <form class="signup-form" action="#" method="POST">
                <div class="form-group">
                    <label for="name">Nome Completo:</label>
                    <input type="text" id="name" name="name" placeholder="Seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Crie uma Senha:</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="interest">Área de Interesse:</label>
                    <select id="interest" name="interest">
                        <option value="vendas">Vendas e Modelos</option>
                        <option value="test-drive">Agendar Test-Drive</option>
                        <option value="manutencao">Manutenção e Peças</option>
                        <option value="eventos">Eventos e Notícias</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Enviar Cadastro</button>
            </form>

            <a href="../index.html" class="back-link">← Voltar à Página Inicial</a>
        </div>
    </main>
    
    <footer class="footer-container">
        <h2>Entre em contato conosco</h2>
        <a href="tel:+5571996443369">Ligue Agora</a>
    </footer>
    
</body>
</html>
